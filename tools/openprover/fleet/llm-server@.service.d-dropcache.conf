# Drop clean page cache before loading a model (cflibs-formal, 2026-09-23). Otherwise cached GGUF
# pages from earlier loads/downloads fill some guest NUMA nodes, numactl --interleave=all cannot
# place the new model evenly, and CPU-side decode is bound by the overfull nodes (infer-02 measured
# 10/21/31/31 GB across its four nodes, ~4-6 tok/s, vs 23/25/23/24 GB on infer-03).
[Service]
ExecStartPre=/bin/sh -c "sync; echo 1 > /proc/sys/vm/drop_caches"
