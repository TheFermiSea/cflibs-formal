name = "cflibs-formal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CflibsFormal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "CflibsFormal"

# Upstream-PR seed: a self-contained (mathlib-only), CF-LIBS-free extract of the forward Saha
# physics, staged for an eventual contribution to leanprover-community/physlib (see
# docs/upstream-physlib-plan.md). NOT part of the verified `CflibsFormal` spec; built + axiom-
# audited separately (`lake build SahaUpstream`; `lake exe axiom-audit --root SahaUpstream`).
[[lean_lib]]
name = "SahaUpstream"
srcDir = "upstream"

# Axiom-cleanliness gate (vendored from leanprover-community/axiom-audit, Apache-2.0; see
# tools/README.md). `lake exe axiom-audit --root CflibsFormal` fails if any declaration
# depends on an axiom outside {propext, Classical.choice, Quot.sound}. Dependency-free.
[[lean_lib]]
name = "AxiomAudit"
srcDir = "tools"

[[lean_exe]]
name = "axiom-audit"
srcDir = "tools"
root = "Main"
supportInterpreter = true

# Declaration-granularity scope-tag gate (a strengthening of
# scripts/check-scope-consistency.sh), two axes per docs/conventions.md section 8: a
# docs/scope-tags.tsv row on a theorem is its RELATION tag, on a definition its MODEL tag, and a
# theorem publishes the weaker of the two (PURE-MATH exempt). `lake exe scope-check` fails on an
# unresolved / ambiguous / duplicate / malformed row, a laundered model row, an own-EXACT theorem
# that transitively USES an own-APPROXIMATION theorem, a published-EXACT theorem that uses a
# published-APPROXIMATION theorem or an APPROXIMATION model (constant-level, via the kernel env),
# or a stale docs/scope-published.tsv; `--write` regenerates that file. Reuses the AxiomAudit
# lib; run after `lake build`.
[[lean_exe]]
name = "scope-check"
srcDir = "tools"
root = "ScopeCheck"
supportInterpreter = true

# Numerical regression-oracle generator: a computable Float MIRROR of the verified forward
# map + classic inversion (NOT part of the verified spec; see oracle/README.md). Emits
# fixtures instantiating the proven theorems. `lake exe oracle-fixtures > oracle/fixtures.json`.
[[lean_exe]]
name = "oracle-fixtures"
srcDir = "oracle"
root = "Generate"
supportInterpreter = true
