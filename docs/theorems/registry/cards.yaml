# Phase-1 card registry. Schema: docs/theorems/SCHEMA.md.
#
# Shape: a flat mapping {id: {...}} -- top-level keys ARE the future card ids, and each entry's
# `planned` list (headline + members) is read by scripts/gen_cards.py's load_registry_cards() /
# scripts/check_cards.py's --require-coverage check. One entry per planned docs/theorems/<id>.md
# card (not yet authored -- a later task writes the cards themselves).
#
# Source: IA-proposal.md section 2.4 (Phase-1 card set); pass1/E-theorem-sources.md.md section 3
# (57-declaration master table, rg-verified in this checkout). IA-proposal.md section 2.4 states
# the Phase-1 plan as "24 cards"; this assignment, built card by card from that same table's
# per-frontier card counts, comes to 23 (the source table's own row-by-row card counts sum to 23,
# not 24 -- flagged for the owner, not resolved here). All 57 declarations are placed exactly once.
