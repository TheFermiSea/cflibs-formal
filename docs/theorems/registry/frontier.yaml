# Frontier registry (FT-01..FT-20, F02-M6, plus the non-FT pilot F07). Schema: docs/theorems/SCHEMA.md.
#
# Shape: a flat mapping {id: {...}} -- top-level keys ARE the ids scripts/check_cards.py reads
# via load_yaml_ids() (a card's frontier.ids must be a key here or the REGISTRY-FRONTIER check
# fails). F07 is included as an id-shaped entry only to record that it maps to no FT-NN item
# (status: not-landed); no card should ever cite frontier.ids: [F07].
#
# Source: docs/research/audit-2026-09-24/{REPORT.md,frontier.json}; pass1/E-theorem-sources.md.md
# section 3 (master table, PR- and rg-verified in this checkout); IA-proposal.md sections 1.7 and
# 3.3 (legacy crosswalk). `landed` names are fully qualified Lean declarations, each verified
# present in this checkout's CflibsFormal/ with `rg` before this file was written.
#
# frontier_json_index is the 0-based position in frontier.json's `frontier` and `verdicts` arrays
# (verified: both arrays are FT-01..FT-20 in order; FT-11 is index 10, verdict 'revise'). F02-M6
# and F07 predate the 2026-09-24 audit and have no frontier.json entry (verified by grep: zero
# hits for both id spellings across frontier.json/REPORT.md/refactor.json/audits.json).
#
# legacy_crosswalk is populated only where pass-1/pass-2 research or a REPORT.md heading states it
# explicitly (D23: no fabricated crosswalk) -- most FT-NN items have none.
