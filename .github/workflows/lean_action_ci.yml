name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# API-docs publishing is intentionally DISABLED (owner decision: do not publish a docs site
# yet; the repository itself is public). Only read access is granted — the `pages: write` /
# `id-token: write` tokens are removed so nothing in CI can deploy to Pages. See the disabled
# docgen step at the end of the job to re-enable after a deliberate choice.
permissions:
  contents: read # Read access to repository contents

# A newer push to the same ref supersedes an older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history: the kernel-replay step diffs against a base commit
      - uses: leanprover/lean-action@v1
      # Warning-free gate: replay the build log and fail on any warning. A `sorry` inside an
      # `example` is only a warning (an example never enters the environment, so the axiom audit
      # below cannot see it); this step and the source scan in scripts/stats.sh close that gap.
      - name: Warning-free build
        run: lake build --wfail
      # Axiom-cleanliness gate: fail CI if any declaration in CflibsFormal depends on an axiom
      # outside {propext, Classical.choice, Quot.sound} (catches sorry/admit, native_decide, and
      # home-rolled axioms — including through imports — which grep cannot). Tool vendored in tools/.
      - name: Axiom-cleanliness gate
        run: lake exe axiom-audit --root CflibsFormal
      # Scope-tag gate (declaration-granular, two axes; docs/conventions.md section 8): a
      # docs/scope-tags.tsv row on a theorem is its RELATION tag, a row on a definition its MODEL
      # tag, and a theorem PUBLISHES the weaker of its relation tag and the model tags in its
      # statement (PURE-MATH exempt). Fails on: an unresolved, ambiguous, duplicate or malformed
      # row; a laundered model row (stronger than the models its definition is built from); an
      # own-EXACT theorem that transitively USES an own-APPROXIMATION theorem; a published-EXACT
      # theorem that transitively uses a published-APPROXIMATION theorem or an APPROXIMATION
      # model; a stale docs/scope-published.tsv. Lists PURE-MATH theorems stated over an
      # APPROXIMATION model as an advisory. Constant-level via the kernel env (AxiomAudit
      # machinery), so it needs the built env and runs after lean-action; it closes the
      # mixed-module false-negative of the module-level scripts/check-scope-consistency.sh below.
      - name: Scope-consistency gate (declaration-granular)
        run: lake exe scope-check
      # Catalog-staleness gate: docs/catalog.jsonl (one JSON line per documented CflibsFormal
      # theorem/def: statement printed with fixed pp options, file:line, binders, used constants,
      # axioms) is generated from the kernel env and read by the docs and the theorem cards (their
      # reviewed statement hash is computed from it). Regenerate and diff, same discipline as the
      # oracle self-check; fix with `lake exe export-catalog > docs/catalog.jsonl`.
      - name: Catalog-staleness gate
        run: |
          lake exe export-catalog > /tmp/catalog.jsonl
          diff -u docs/catalog.jsonl /tmp/catalog.jsonl
      # Upstream-seed gate: the SahaUpstream lib (the self-contained physlib seed) is not in
      # defaultTargets, so build + axiom-audit it explicitly to keep the "axiom-audited separately"
      # claim in lakefile.toml true.
      - name: Upstream-seed gate
        run: |
          lake build SahaUpstream
          lake exe axiom-audit --root SahaUpstream
      # Kernel-replay gate: re-check every module this change touched (under CflibsFormal/ or
      # upstream/, hence after the upstream build above) with the toolchain's
      # built-in `leanchecker`. `lake build` and axiom-audit trust the .olean files as stored; the
      # kernel replay does not (rejects stale/corrupted/hand-forged oleans). Per module ~42 s and
      # ~2.6 GB, so only CHANGED modules run here; the weekly workflow sweeps all of them.
      - name: Kernel-replay gate (changed modules)
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          echo "kernel-replay base: $BASE"
          KERNEL_REPLAY_JOBS=2 ./scripts/kernel-replay.sh --changed "$BASE"
      # Source hygiene + stats (no Lean needed): every import, read token by token, names only
      # Mathlib/CflibsFormal (acyclicity is guaranteed by the build); every module is imported by
      # the root; no sorry / admit / native_decide / axiom / kernel-bypass token outside comments
      # (this covers `example`s). Also prints derived declaration counts.
      - name: Source-hygiene + stats
        run: ./scripts/stats.sh
      # Style/structure-lint gate: mathlib/batteries environment linters (docBlame, simpNF,
      # unusedArguments, ...) on the CflibsFormal library — catches missing docstrings, unused
      # hypotheses, non-simp-normal-form lemmas, etc. that build + axiom-audit do not.
      - name: Lint gate
        run: lake exe runLinter CflibsFormal
      # Regression-oracle self-check: the committed fixtures must match the generator (no drift),
      # and the reference checker must pass (fixtures internally consistent with the spec formulas).
      - name: Regression-oracle self-check
        run: |
          lake exe oracle-fixtures > /tmp/fixtures.json
          diff -u oracle/fixtures.json /tmp/fixtures.json
          python3 oracle/check_fixtures.py
      # Companion-facing fixture sets (oracle/line_extraction, oracle/tier2): the reference kernel
      # and the reference predicates must satisfy their own committed fixtures. These are NOT
      # regenerated and byte-diffed here: the generators use vectorised numpy, whose last bits can
      # differ between CPUs, so only the tolerance-based checkers run.
      - name: Line-extraction and Tier-2 fixture self-check
        run: |
          python3 -m pip install --quiet 'numpy==2.4.4'
          python3 oracle/line_extraction/check_fixtures.py
          python3 oracle/tier2/check_fixtures.py
      # Docs-sync + scope-tag-completeness gate: recompute the auto docs without writing and fail
      # if (a) any result is missing a curated scope tag in docs/scope-tags.tsv, a theorem in the
      # kernel-derived docs/catalog.jsonl has no tag or a source result is not in that catalog, a
      # physics-tagged module has no `## Literature` section, or docs/scope-published.tsv is
      # missing; or (b) the committed module-reference / theorem-catalog, or the size line in
      # README.md / AGENTS.md / CONTEXT.md, differ from what the source gives.
      # The catalog renders each result's own -> published tag
      # from docs/scope-published.tsv, which the scope-check step above has already verified is
      # current. Same regenerate-and-diff discipline as the oracle self-check; this is the
      # integrity-spine gate — a new theorem cannot land undocumented OR without an
      # EXACT/REDUCED/APPROXIMATION/PURE-MATH tag.
      - name: Docs-sync gate
        run: ./scripts/gen-docs.sh --check
      # Citation-integrity gate: every citation string in column 4 of docs/scope-tags.tsv must be
      # on docs/citation-whitelist.tsv and none may be SUSPECT-OR-FABRICATED (the check that would
      # have stopped an off-whitelist citation merging). Build-free: bash + python3 only.
      - name: Citation-whitelist gate
        run: ./scripts/check-citations.sh
      # Theorem-card gate (decisions D21, D24): the card checker first proves it can fail on its
      # own broken fixtures, then checks every card in docs/theorems/ against docs/catalog.jsonl
      # (declarations resolve, reviewed statement hash current, citations whitelisted, registries,
      # no local paths). The generated Facts blocks, index and open-items roll-up must be current.
      - name: Theorem-card gate
        run: |
          python3 -m pip install --quiet 'pyyaml==6.0.2'
          python3 scripts/check_cards.py --selftest
          python3 scripts/gen_cards.py
          # `git status` also sees a generated file that is new or was deleted and regenerated.
          test -z "$(git status --porcelain -- docs/theorems/)" || { git status --short -- docs/theorems/; git diff -- docs/theorems/ | head -100; exit 1; }
      # Epistemic-drift ADVISORY (module-level): a fast, build-free companion to the authoritative
      # declaration-granular `scope-check` gate above. It also surfaces EXACT-on-REDUCED and
      # EXACT-on-mixed dependencies as advisory warnings (module granularity cannot prove per-theorem
      # over-reach — that is what scope-check does), and still FAILs on an EXACT-on-PURE-approximation
      # module.
      - name: Scope-consistency advisory (module-level)
        run: ./scripts/check-scope-consistency.sh
      # API-docs publishing (doc-gen4 HTML -> GitHub Pages) is DISABLED on purpose (owner decision:
      # no public docs site yet). The HTML reference can still be built on demand (doc-gen4, see
      # leanprover/doc-gen4). To publish later, restore the `pages: write` / `id-token: write`
      # permissions above and re-enable this step.
      # - uses: leanprover-community/docgen-action@v1
